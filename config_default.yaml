# Generic defaults: works on a new survey file with no editing. Layout, header row and open-ended columns are detected.
# Run: survey-nlp run --config config_default.yaml --input data/your_file.xlsx
run_dir: runs/auto
mode: extended        # extended = negation fix, Like/Dislike rating rules, lukewarm and complaint wording below. spec = the model's ratings only (see PROJECT_SPEC.md)
seed: 42
device: auto
input:
  path: data/survey.xlsx
  sheet: 0
  header_row: auto
  skip_rows: 0
  id_col: null
  keep_cols: []
  min_chars: 2
  spell_correct: true         # repair typos in the text the models read (the answer shown in the results is unchanged); changes are listed on the 'spelling' sheet
  spell_min_count: 3          # a word written this many times is not a typo
  non_answer_examples:
  - I have no complaints
  - I didn't find any negative
  - Nothing to report on the negative side
  - There is nothing I disliked
  - No downsides or issues
  - I can't think of anything
  - Nothing at all
  - No bad points at all
  - I struggle to find anything negative
  - Can't fault it
  - All good, nothing to add
  non_answer_min_sim: 0.8
  non_answer_regex: ^(n/?a|none|nil|nope?|no comment|-+|(there (is|was) |i (have|had) )?nothing\b(?!.*\b(smell|doesn.?t|not|too|but)\b).*|no (dislikes?|negatives?|complaints?|issues?)\b.*|not (one|a single)
    thing\b.*|.*\b(nothing|no|not anything|anything) (to|i) ?(dislike|disliked|fault|complain)\b.*|.*\b(didn.?t|don.?t|did not|do not) (have any |really )?dislike[sd]?( anything| a thing)?)[ .!]*$
  auto_detect:
    min_mean_words: 4
    min_unique_ratio: 0.3
  layout: auto
segment:
  contrast_words:
  - but
  - however
  - although
  - though
  - yet
  - whereas
  min_words: 2
embed:
  model: BAAI/bge-small-en-v1.5
  batch_size: 128
  max_seq_length: 128
  fp16: true
  cache_dir: cache
themes:
  scope: pooled
  spacy_model: en_core_web_sm
  min_words: 2
  max_fit_clauses: 20000
  fallback_max_clauses: 4000
  umap_dims: 5
  umap_neighbors: 15
  min_cluster_size: 6
  min_cluster_frac: 0.01
  min_samples: 2
  merge_cosine: 0.92
  min_themes: 2
  min_theme_clauses: 8
  fallback_k_range:
  - 2
  - 10
  n_keywords: 8
  center: true
  center_strength: 0.7   # remove 70% of the shared direction, so the most common topic still has a direction
  required:                       # built in, not survey-specific: generic remarks ("it is good", "not for me") get this theme
  - name: General comment
    semantic_only: true           # no keywords, matched by meaning only
    general: true                 # also receives every clause no other theme matched, so every answer has a theme
    seeds:
    - It is good
    - I like it
    - I enjoyed it
    - I do not like it
    - Not for me
    - No good
  split_large_frac: 0.3
  n_themes: 10
  sentiment_axis:                 # take the positive-vs-negative direction out of the embeddings so themes form by TOPIC, not by tone
    positive: [It is good, I love it, I really like it, It is great, It is excellent, Very nice]
    negative: [It is bad, I hate it, I really dislike it, It is terrible, It is awful, Very unpleasant]
  required_kw_min_sim: 0.35       # a word learned for a theme you added must be this close in meaning to the theme (drops 'good', 'favourite' from Price)
  required_merge_cos: 0.95        # a built-in theme is added as its own theme, never renames a discovered one
assign:
  min_sim: 0.4
  secondary_margin: 0.1
  keyword_min_len: 3
  center: true
  keyword_min_precision: 0.5
  fallback_min_sim: 0.12
  max_themes_per_clause: 2
  use_discovered_keywords: false
  general_min_sim: 0.9          # a clause this close in meaning to a general comment below is left without a theme
  general_examples:
  - It is good
  - I like it
  - I enjoy it
  - It is fine
  - Normal
  - Nothing special
  - I would recommend it
  - Overall it is nice
  - I like the overall experience
  - It is okay
overall:
  model: cardiffnlp/twitter-roberta-base-sentiment-latest
  batch_size: 64
  max_length: 256
absa:
  model: yangheng/deberta-v3-base-absa-v1.1
  batch_size: 64
  max_length: 128
  evidence_threshold: 0.6
  allowance: 0.05
  quantize_cpu: false
output:
  codes:
    neutral: 0
    positive: 1
    negative: 2
  not_discussed_value: null
  mixed_policy: stronger
  include_overall: true
  labels:
    neutral: Neutral
    positive: Positive
    negative: Negative
  question_labels: {}
  auto_polarity: true
  # General English, not tied to any survey. Edit or extend for your language / topic.
  # A remark that is a complaint by itself: in a question that asks for praise the answer is rated Negative. 'not too sweet' is not one.
  complaint_phrases:
  - (?<!not )(?<!n't )(?<!no )(?<!as )(?<!without being )(?<!never )(?<!not be )\btoo\s+\w+
  - \bnot\s+(?:\w+\s+){0,2}enough\b
  - \b(?:lacks?|lacking|lack of|insufficient|too little|could be better)\b
  # A hedged remark ("a bit sweet", "slightly flat") is a mild complaint when the question asks for praise, unless the answer also says something good or has a but/though.
  - '^(?!.*\b(?:but|though|although|however|yet|nice|good|great|better|love|lovely|like|enjoy\w*|refreshing|pleasant|smooth|tasty|delicious|energi\w+)\b).*\b(?:a bit|a little|slightly|somewhat|bit)\s+(?!too\b)\w+'
  # Lukewarm wording: with no clearly positive or negative word left over, the answer is rated Neutral.
  neutral_phrases:
  - \b(?:ok|okay)\b
  - \b(?:normal|average|ordinary|standard|typical|plain|moderate(?:ly)?|mild|mediocre|unremarkable|inoffensive|indifferent|acceptable|tolerable|passable|neutral|meh)\b
  - \bso-so\b
  - \bnothing (?:special|much|exceptional|remarkable|extraordinary)\b
  - \bnot (?:particularly|especially|very|that) (?:good|great|special|impressive|memorable|exciting)\b
  - \bneither (?:good|great|nice) nor (?:bad|terrible|awful)\b
  - \bpleasant enough\b
  - \bgood enough\b
  - \b(?:alright|adequate|satisfactory|bearable|fine|fair)\b
  - \bnothing wrong\b
  - \bnothing to write home about\b
  - \bmiddle of the road\b
  # Words that make a remark a complaint or praise by themselves, so it is not lukewarm.
  neutral_blockers:
  - \b(?:too|overly|excessive(?:ly)?|lacks?|lacking|insufficient|unpleasant|awful|terrible|love|great|amazing|excellent)\b
